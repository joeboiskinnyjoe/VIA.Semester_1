<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link{ /*the spudoclass link is connected to all a tags in this example, but this could also be a h tag or the intire body
                    tag*/
            color: red;
        }
         a:visited{ /*this spudo class applies when a link has allready been visited by the user*/
            color: grey;
        }
        a:hover{ /*this spudoclass applies to when the curser is hovering the link*/
            color: green;
        }
    </style>
    
</head>
<body>
    <a href="https://www.google.com/">Link</a>
</body>
</html>
